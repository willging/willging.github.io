<html lang="es">

        body {

            justify-content: center;

        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin: 1rem 0;
        }
        a {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        a:hover {
            background-color: #2980b9;
        }
