.fl{animation:fl 15s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(0,-9px)}}
.sw{animation:sw 19s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.bl{animation:bl 23s ease-in-out infinite alternate}
@keyframes bl{to{transform:scale(1.04) rotate(1.2deg)}}
.dash{animation:dash 160s linear infinite}
@keyframes dash{to{stroke-dashoffset:-1200}}
.rung{animation:rg 10s ease-in-out infinite}
@keyframes rg{0%,100%{opacity:.2}50%{opacity:1}}
.eye{animation:eye 17s ease-in-out infinite}
@keyframes eye{0%,100%{transform:translate(0,0)}30%{transform:translate(4px,1px)}65%{transform:translate(-3px,-3px)}}
.tw{animation:tw 12s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
