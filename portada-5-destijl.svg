.nd{animation:nd 12s ease-in-out infinite}
@keyframes nd{0%,100%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.aw{opacity:.0}}
</style>
