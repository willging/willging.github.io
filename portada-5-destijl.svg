<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 612" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Portada: De Stijl</title>
<desc id="d">Composición de rectángulos de colores primarios y líneas negras, donde algunas celdas se colorean y se apagan lentamente y los cruces laten como nodos.</desc>
<style>
