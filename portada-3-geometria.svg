<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 612" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Portada: geometría</title>
<desc id="d">Composición minimalista de círculos, órbitas, arcos y un brote, con una ola de puntos que cruza la cuadrícula.</desc>
<defs>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.5"/></pattern>
<linearGradient id="cov" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#E8E7E2"/><stop offset=".40" stop-color="#E8E7E2"/><stop offset=".49" stop-color="#E8E7E2" stop-opacity="0"/><stop offset=".51" stop-color="#E8E7E2" stop-opacity="0"/><stop offset=".60" stop-color="#E8E7E2"/><stop offset="1" stop-color="#E8E7E2"/></linearGradient>
</defs>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.v{transform-box:view-box}
.sweep{animation:sw 22s linear infinite}
@keyframes sw{from{transform:translateX(-2400px)}to{transform:translateX(0)}}
.breathe{animation:br 24s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.orb{animation:rot 90s linear infinite;transform-origin:760px 300px}
.orb2{animation:rot 150s linear infinite reverse;transform-origin:760px 300px}
@keyframes rot{to{transform:rotate(360deg)}}
.sl{animation:sl 26s ease-in-out infinite alternate}
@keyframes sl{to{transform:translateX(380px)}}
.sway{animation:sway 16s ease-in-out infinite alternate;transform-origin:330px 612px}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.ripple{animation:rp 12s ease-in-out infinite}
@keyframes rp{0%,100%{opacity:.12}50%{opacity:.75}}
.spin{animation:rot 80s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
